<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Patient Report Download | Rajan Path Lab</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #eef2f7 0%, #dce3ec 100%);
      font-family: 'Inter', 'Segoe UI', 'Roboto', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" opacity="0.025"><path fill="none" d="M0 150 L400 150 M200 0 L200 300" stroke="%23333" stroke-width="0.5"/><circle cx="90" cy="70" r="16" stroke="%23997b38" fill="none" stroke-width="1"/><circle cx="310" cy="210" r="20" stroke="%23997b38" fill="none" stroke-width="0.8"/></svg>');
      background-repeat: repeat;
      pointer-events: none;
      z-index: 0;
    }

    .classic-premium-card {
      max-width: 860px;
      width: 100%;
      background: #ffffff;
      border-radius: 2rem;
      box-shadow: 0 30px 45px -20px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(212, 175, 55, 0.25);
      position: relative;
      z-index: 10;
      overflow: hidden;
    }

    .classic-premium-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, #b49450, #e6c87a, #b49450);
      z-index: 20;
    }

    .premium-header {
      background: #1a212c;
      padding: 1.8rem 2rem 1.4rem;
    }

    .header-flex {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .header-flex h1 {
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: #fef7e8;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .classic-badge {
      background: rgba(212, 175, 55, 0.2);
      padding: 6px 16px;
      border-radius: 60px;
      font-size: 0.7rem;
      font-weight: 600;
      color: #e6c168;
      border: 0.5px solid rgba(212, 175, 55, 0.5);
    }

    .header-sub {
      color: #8f9bb3;
      font-size: 0.8rem;
      margin-top: 12px;
      border-left: 2px solid #e6c168;
      padding-left: 14px;
    }

    .form-container {
      padding: 2rem 2rem 1.8rem;
    }

    .input-group {
      margin-bottom: 1.5rem;
      position: relative;
    }

    .input-label {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #2c3f4c;
      margin-bottom: 10px;
    }

    .input-label span {
      background: #f0f3f9;
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      font-size: 1rem;
    }

    .classic-input {
      width: 100%;
      padding: 1rem 1.3rem;
      font-size: 1rem;
      font-family: 'Inter', 'Segoe UI', monospace;
      background: white;
      border: 1.5px solid #e2e8f0;
      border-radius: 1.25rem;
      transition: all 0.25s;
      outline: none;
      font-weight: 500;
      color: #0f172a;
    }

    .classic-input:focus {
      border-color: #d4af37;
      box-shadow: 0 4px 14px rgba(212, 175, 55, 0.2);
    }

    .whatsapp-premium-btn {
      width: 100%;
      background: linear-gradient(98deg, #075E54 0%, #128C7E 100%);
      border: none;
      padding: 1rem 1.5rem;
      font-size: 1rem;
      font-weight: 700;
      font-family: inherit;
      color: white;
      border-radius: 2rem;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: 0 8px 20px -8px rgba(7, 94, 84, 0.5);
      margin-top: 0.5rem;
    }

    .whatsapp-premium-btn:hover {
      transform: translateY(-2px);
      background: linear-gradient(98deg, #064e44 0%, #0e6b5f 100%);
      box-shadow: 0 14px 26px -10px rgba(7, 94, 84, 0.7);
    }

    .whatsapp-premium-btn:active {
      transform: translateY(1px);
    }

    .status-area {
      margin-top: 1.2rem;
      padding: 0.9rem 1.2rem;
      background: #f8fafd;
      border-radius: 1rem;
      font-size: 0.85rem;
      color: #2c3e50;
      border-left: 3px solid #c9a03d;
      transition: 0.2s;
      line-height: 1.4;
      font-weight: 500;
    }

    .status-success {
      background: #e6f4ea;
      border-left-color: #2b7a3e;
      color: #135c2c;
    }

    .status-error {
      background: #fef5f0;
      border-left-color: #d4873a;
      color: #8b5a2b;
    }

    .status-loading {
      background: #fff1df;
      border-left-color: #e6a017;
    }

    .report-list {
      margin-top: 1.5rem;
      border-top: 1px solid #e2e8f0;
      padding-top: 1.5rem;
    }

    .report-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8fafc;
      padding: 0.8rem 1.2rem;
      border-radius: 1rem;
      margin-bottom: 0.8rem;
      border: 1px solid #edf2f7;
      transition: 0.2s;
    }

    .report-item:hover {
      background: #f1f5f9;
    }

    .report-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .report-info .test-name {
      font-weight: 600;
      color: #1a212c;
    }

    .report-info .upload-date {
      font-size: 0.8rem;
      color: #7890a3;
    }

    .report-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .download-btn {
      background: #d4af37;
      border: none;
      padding: 0.4rem 1rem;
      border-radius: 2rem;
      font-weight: 600;
      color: white;
      cursor: pointer;
      transition: 0.2s;
      font-size: 0.8rem;
    }

    .download-btn:hover {
      background: #b8960e;
      transform: scale(1.02);
    }

    .download-btn:disabled {
      background: #b0b8c5;
      cursor: not-allowed;
      opacity: 0.6;
      transform: none;
    }

    .due-badge {
      background: #fee2e2;
      color: #991b1b;
      padding: 0.2rem 0.8rem;
      border-radius: 2rem;
      font-size: 0.7rem;
      font-weight: 700;
    }

    .premium-footer {
      padding: 1rem 2rem 1.4rem;
      font-size: 0.7rem;
      color: #91a3bb;
      border-top: 1px solid #edf2f9;
      display: flex;
      justify-content: space-between;
    }

    @media (max-width: 650px) {
      .form-container { padding: 1.5rem; }
      .header-flex h1 { font-size: 1.5rem; }
      .report-item { flex-direction: column; align-items: flex-start; gap: 10px; }
      .report-actions { width: 100%; justify-content: flex-end; }
    }
  </style>
</head>
<body>

<div class="classic-premium-card">
  <div class="premium-header">
    <div class="header-flex">
      <h1>📄 PATIENT REPORT PORTAL <span class="classic-badge">DOWNLOAD</span></h1>
    </div>
    <div class="header-sub">◆ Enter your Patient ID to view & download reports ◆</div>
  </div>

  <div class="form-container">
    <!-- PATIENT ID INPUT -->
    <div class="input-group">
      <div class="input-label">
        <span>🆔</span> PATIENT ID
      </div>
      <input type="text" id="patientIdInput" class="classic-input" placeholder="Enter your Patient ID (e.g. P001 or RPL-062026-1186)" autocomplete="off">
    </div>

    <!-- Search / Fetch Button -->
    <button id="fetchReportBtn" class="whatsapp-premium-btn">
      <span>🔍</span> VIEW MY REPORTS →
    </button>

    <!-- Status Message -->
    <div id="statusMsg" class="status-area">
      ◆ Enter your Patient ID and click "VIEW MY REPORTS"
    </div>

    <!-- Report List will be injected here -->
    <div id="reportListContainer" class="report-list" style="display: none;"></div>

    <div class="premium-footer">
      <span>✦ SECURE DOWNLOAD SYSTEM ✦</span>
      <span>RAJAN PATH LAB</span>
    </div>
  </div>
</div>

<script>
  (function() {
    'use strict';

    // ─── CONSTANTS ───
    const DB_NAME = 'RPL_PDF_DB';
    const STORE_NAME = 'pdf_files';
    let db = null;

    // ─── DOM REFS ───
    const patientIdInput = document.getElementById('patientIdInput');
    const fetchBtn = document.getElementById('fetchReportBtn');
    const statusDiv = document.getElementById('statusMsg');
    const reportListContainer = document.getElementById('reportListContainer');

    // ─── INDEXED DB HELPERS ───
    function openDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = function(e) {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: 'id' });
          }
        };
        request.onsuccess = function(e) {
          db = e.target.result;
          resolve(db);
        };
        request.onerror = function(e) {
          reject(e.target.error);
        };
      });
    }

    function getPDFFile(reportId) {
      return new Promise((resolve, reject) => {
        if (!db) return reject('DB not open');
        const tx = db.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const request = store.get(reportId.toString());
        request.onsuccess = () => resolve(request.result ? request.result.file : null);
        request.onerror = (e) => reject(e.target.error);
      });
    }

    // ─── DATA LOADING FROM localStorage ───
    function loadData(key, defaultData) {
      try {
        const stored = localStorage.getItem('rpl_' + key);
        if (stored) {
          const parsed = JSON.parse(stored);
          if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          return parsed; // could be empty array
        }
      } catch (e) { /* ignore */ }
      return defaultData;
    }

    // ─── MAIN FETCH FUNCTION ───
    async function fetchPatientReports() {
      const patientId = patientIdInput.value.trim();
      if (!patientId) {
        statusDiv.innerHTML = '⚠️ Please enter your Patient ID.';
        statusDiv.className = 'status-area status-error';
        reportListContainer.style.display = 'none';
        return;
      }

      // Load patients and reports from localStorage
      const defaultPatients = [
        { patient_id: 'P001', name: 'Ravi Kumar', phone: '9876543210', test: 'CBC', status: 'pending', due_amount: 450 },
        { patient_id: 'P002', name: 'Priya Singh', phone: '9876543211', test: 'Thyroid', status: 'process', due_amount: 0 },
        { patient_id: 'RPL-062026-1186', name: 'Rajesh Gupta', phone: '9876543214', test: 'CBC WIDAL BSR', status: 'pending', due_amount: 0 }
      ];
      const defaultReports = [
        { id: 1, patient_id: 'P001', name: 'Ravi Kumar', test_name: 'CBC', file_path: 'P001_CBC.pdf', uploaded_at: new Date().toLocaleString() },
        { id: 2, patient_id: 'P002', name: 'Priya Singh', test_name: 'Thyroid', file_path: 'P002_Thyroid.pdf', uploaded_at: new Date().toLocaleString() }
      ];

      const patients = loadData('patients', defaultPatients);
      const reports = loadData('reports', defaultReports);

      // Find patient
      const patient = patients.find(p => p.patient_id === patientId);
      if (!patient) {
        statusDiv.innerHTML = `❌ No patient found with ID: ${patientId}`;
        statusDiv.className = 'status-area status-error';
        reportListContainer.style.display = 'none';
        return;
      }

      // Get reports for this patient
      const patientReports = reports.filter(r => r.patient_id === patientId);
      if (patientReports.length === 0) {
        statusDiv.innerHTML = `ℹ️ No reports found for patient: ${patient.name} (${patientId})`;
        statusDiv.className = 'status-area';
        reportListContainer.style.display = 'none';
        return;
      }

      // Display reports
      statusDiv.innerHTML = `✅ Found ${patientReports.length} report(s) for ${patient.name}. Due amount: ₹${patient.due_amount}`;
      statusDiv.className = 'status-area status-success';

      // Build report list HTML
      let html = `<h3 style="margin-bottom:1rem;font-weight:600;color:#1a212c;">📋 Your Reports</h3>`;
      for (const report of patientReports) {
        const canDownload = patient.due_amount === 0;
        const dueBadge = patient.due_amount > 0 ? `<span class="due-badge">₹${patient.due_amount} DUE</span>` : '';
        html += `
          <div class="report-item">
            <div class="report-info">
              <span class="test-name">${report.test_name}</span>
              <span class="upload-date">📅 ${report.uploaded_at}</span>
            </div>
            <div class="report-actions">
              ${dueBadge}
              <button class="download-btn" data-report-id="${report.id}" data-patient-due="${patient.due_amount}" ${canDownload ? '' : 'disabled'}>
                ${canDownload ? '⬇️ Download' : '🔒 Locked'}
              </button>
            </div>
          </div>
        `;
      }
      reportListContainer.innerHTML = html;
      reportListContainer.style.display = 'block';

      // Attach download event listeners
      document.querySelectorAll('.download-btn').forEach(btn => {
        btn.addEventListener('click', async function(e) {
          const reportId = parseInt(this.dataset.reportId);
          const due = parseFloat(this.dataset.patientDue);
          if (due > 0) {
            statusDiv.innerHTML = '❌ Payment pending. Please clear dues to download report.';
            statusDiv.className = 'status-area status-error';
            return;
          }
          // Download
          try {
            const fileBlob = await getPDFFile(reportId);
            if (!fileBlob) {
              statusDiv.innerHTML = '❌ PDF file not found in storage.';
              statusDiv.className = 'status-area status-error';
              return;
            }
            const url = URL.createObjectURL(fileBlob);
            const a = document.createElement('a');
            a.href = url;
            const report = patientReports.find(r => r.id === reportId);
            a.download = report ? report.file_path : 'report.pdf';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            statusDiv.innerHTML = '✅ Download started!';
            statusDiv.className = 'status-area status-success';
          } catch (e) {
            statusDiv.innerHTML = '❌ Error downloading: ' + e.message;
            statusDiv.className = 'status-area status-error';
          }
        });
      });
    }

    // ─── EVENT LISTENERS ───
    fetchBtn.addEventListener('click', fetchPatientReports);
    patientIdInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') fetchPatientReports();
    });

    // ─── INIT ───
    // Open IndexedDB
    openDB().then(() => {
      console.log('✅ IndexedDB ready for patient portal.');
    }).catch(e => {
      console.warn('IndexedDB not available', e);
    });

    // Auto-focus
    patientIdInput.focus();

  })();
</script>

</body>
</html>
