<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Path Lab Booking</title>
    <!-- Premium Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="booking-container">
        <header>
            <div class="logo-wrapper">
                <img src="logo.png" alt="Medical Logo" class="logo">
            </div>
            <h1>Premium Path Lab</h1>
            <p class="subtitle">Secure & Reliable Diagnostic Booking</p>
        </header>
        
        <form class="booking-form">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required>
            </div>
            
            <!-- Row 1: Age & Mobile -->
            <div class="form-row">
                <div class="form-group">
                    <label for="age">Age</label>
                    <input type="number" id="age" name="age" placeholder="Years" required>
                </div>
                
                <div class="form-group">
                    <label for="mobile">Mobile Number</label>
                    <input type="tel" id="mobile" name="mobile" placeholder="E.g. +91 98765 43210" required>
                </div>
            </div>
            
            <!-- Row 2: Ref By & Test Name -->
            <div class="form-row">
                <div class="form-group">
                    <label for="ref">Referred By</label>
                    <input type="text" id="ref" name="ref" placeholder="Doctor or Self">
                </div>
                
                <div class="form-group">
                    <label for="test">Test Name / Package</label>
                    <input type="text" id="test" name="test" placeholder="E.g. Full Body, CBC" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="address">Collection Address</label>
                <input type="text" id="address" name="address" placeholder="Complete address for home collection" required>
            </div>
            
            <div class="form-group">
                <label for="date">Preferred Date</label>
                <input type="date" id="date" name="date" required>
            </div>
            
            <button type="submit" class="whatsapp-btn">
                <span>Confirm Booking via WhatsApp</span>
            </button>
        </form>
    </div>
</body>
</html>
