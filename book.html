<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Path Lab Booking</title>
    <!-- Premium Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Premium Icons (Remix Icon) -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="booking-container">
        <!-- Luxury Badge / Accent Line -->
        <div class="top-bar"></div>

        <header>
            <div class="logo-container">
                <!-- अगर आपके पास लोगो इमेज नहीं है, तो यह आइकॉन एक क्लासिक मेडिकल सील की तरह दिखेगा -->
                <div class="premium-seal">
                    <i class="ri-heart-pulse-line"></i>
                </div>
            </div>
            <h1>EXCELSIOR</h1>
            <p class="subtitle">DIAGNOSTICS & PATH LAB</p>
            <div class="divider"><span>•••</span></div>
            <p class="form-title">Digital Test Requisition Form</p>
        </header>
        
        <form class="booking-form">
            
            <!-- SECTION 1: PATIENT PROFILE -->
            <div class="form-section">
                <h2 class="section-heading">01. Patient Profile</h2>
                
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <div class="input-wrapper">
                        <i class="ri-user-3-line input-icon"></i>
                        <input type="text" id="name" name="name" placeholder="Enter patient's full name" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="age">Age (In Years)</label>
                        <div class="input-wrapper">
                            <i class="ri-calendar-event-line input-icon"></i>
                            <input type="number" id="age" name="age" placeholder="Age" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="mobile">Contact Number</label>
                        <div class="input-wrapper">
                            <i class="ri-phone-line input-icon"></i>
                            <input type="tel" id="mobile" name="mobile" placeholder="Mobile number" required>
                        </div>
                    </div>
                </div>
            </div>

            <!-- SECTION 2: TEST & LOGISTICS -->
            <div class="form-section">
                <h2 class="section-heading">02. Test & Logistics Details</h2>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="test">Prescribed Test / Package</label>
                        <div class="input-wrapper">
                            <i class="ri-flask-line input-icon"></i>
                            <input type="text" id="test" name="test" placeholder="e.g., CBC, Lipid Profile" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="ref">Referred By</label>
                        <div class="input-wrapper">
                            <i class="ri-stethoscope-line input-icon"></i>
                            <input type="text" id="ref" name="ref" placeholder="Doctor name or 'Self'">
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="address">Home Collection Address</label>
                    <div class="input-wrapper">
                        <i class="ri-map-pin-line input-icon"></i>
                        <input type="text" id="address" name="address" placeholder="Complete address for phlebotomist visit" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="date">Preferred Appointment Date</label>
                    <div class="input-wrapper">
                        <i class="ri-time-line input-icon"></i>
                        <input type="date" id="date" name="date" required>
                    </div>
                </div>
            </div>
            
            <!-- PREMIUM BUTTON -->
            <button type="submit" class="whatsapp-btn">
                <i class="ri-whatsapp-line"></i>
                <span>Authorize & Book via WhatsApp</span>
            </button>

            <footer class="form-footer">
                <p><i class="ri-shield-check-line"></i> 256-bit Encrypted Secure Direct Booking Port</p>
            </footer>
        </form>
    </div>

</body>
</html>
